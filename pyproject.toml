[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harnessprobe"
version = "0.1.0"
description = "Extract the LLM-dependent harness scope of a repo and subset coverage.py JSON to it."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[project.scripts]
harnessprobe = "harnessprobe.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/harnessprobe"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs", "scripts", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
